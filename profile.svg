<svg
  width="900"
  height="600"
  viewBox="0 0 900 600"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- bubble -->
  <rect
    x="20"
    y="50"
    width="600"
    height="400"
    rx="50"
    fill="#eeeeee"
    stroke="#555"
    stroke-width="2"
  />

  <!-- tail -->
  <polygon
    points="610,270 680,320 610,370"
    fill="#eeeeee"
    stroke="#555"
    stroke-width="2"
  />

  <!-- super awesome text  -->
  <g
    font-family="monospace"
    font-size="18"
    fill="#222"
  >
    <text x="60" y="110">test</text>
    <text x="60" y="145">test</text>
    <text x="60" y="170">test</text>
    <text x="60" y="215">test</text>
    <text x="80" y="240">test</text>
    <text x="80" y="265">test</text>
    <text x="60" y="310">test</text>
    <text x="80" y="335">test</text>
  </g>

  <image
    href="individualDrawingCharacter.png"
    x="650"
    y="20"
    width="230"
    height="560"
    preserveAspectRatio="xMidYMid meet"
  />

</svg>
